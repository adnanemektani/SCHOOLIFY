services:
  postgres:
    image: postgres:16-alpine
    container_name: schoolify-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: schoolify
      POSTGRES_PASSWORD: schoolify_dev_password
      POSTGRES_DB: schoolify
    ports:
      - "5434:5432"
    volumes:
      - schoolify_postgres_data:/var/lib/postgresql/data

volumes:
  schoolify_postgres_data:
